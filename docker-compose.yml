# Local Postgres for development. The API and web app run on your machine (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bioverse
      POSTGRES_PASSWORD: bioverse
      POSTGRES_DB: bioverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioverse"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
