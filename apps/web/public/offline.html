<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#134E4A" />
    <title>Offline · Bioverse One</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100%;
        display: grid; place-items: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: linear-gradient(160deg, #134e4a 0%, #1b6b63 45%, #2f9e8f 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 420px; text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
        background: rgba(255, 255, 255, 0.14); display: grid; place-items: center;
      }
      h1 { margin: 0 0 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; font-size: 16px; color: rgba(255, 255, 255, 0.86); }
      button {
        min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
        background: #fff; color: #134e4a; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
      }
      button:hover { background: #e6f4f1; }
      button:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.7); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
          <path d="M16 6v20M6 16h20" /><circle cx="16" cy="16" r="5" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Bioverse One needs a connection to show your health information.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself as soon as the connection comes back.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
